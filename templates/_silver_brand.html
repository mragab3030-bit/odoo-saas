{# Silver Solutions branding for the login pages. #}
<style>
  .silver-brand {
    --ss-magenta: #810054;
    --ss-charcoal: #444444;
    text-align: center; margin-bottom: 2rem;
  }
  .silver-brand-logo {
    display: block; margin: 0 auto .9rem;
    max-height: 80px; max-width: 100%;
    width: auto; height: auto; object-fit: contain;
  }
  .silver-brand-sub { color: var(--text-muted); font-size: .9rem; margin: 0; }
  .silver-brand-name { font-weight: 800; letter-spacing: .01em; }
  .silver-brand-name .ss-mark { color: var(--ss-magenta); }
  .silver-brand-name .ss-word { color: var(--ss-charcoal); }

  /* Midnight has a dark card: sit the logo on a light plate and lift the
     brand colours so they stay readable. */
  [data-theme="midnight"] .silver-brand-logo {
    background: #ffffff; border-radius: 10px; padding: .45rem .75rem;
    box-sizing: content-box;
  }
  [data-theme="midnight"] .silver-brand-name .ss-mark { color: #e04a9e; }
  [data-theme="midnight"] .silver-brand-name .ss-word { color: #e5e7eb; }
</style>
<div class="silver-brand">
  <img class="silver-brand-logo"
       src="{{ url_for('static', filename='img/silver-solutions-logo.png') }}"
       alt="Silver Solutions" width="224" height="80">
  <p class="silver-brand-sub">
    <span class="silver-brand-name" style="white-space:nowrap"><span class="ss-mark">SS</span> <span class="ss-word">Dashboard</span></span>
    — Powered by Silver Solutions
  </p>
</div>
