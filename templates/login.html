<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign in · Olens — Odoo Analytics Platform</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <script>
    (function () {
      try {
        var t = localStorage.getItem('olens.theme');
        if (t === 'light' || t === 'midnight' || t === 'dark') {
          document.documentElement.setAttribute('data-theme', t);
        }
      } catch (e) {}
    })();
  </script>
</head>
<body>
<div class="login-page">
  <div class="login-card">

    <div class="login-logo">
      <div class="logo-icon">
        <svg class="olens-logo" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <line x1="42" y1="42" x2="58" y2="58" stroke="#E63030" stroke-width="6" stroke-linecap="round"/>
          <circle cx="27" cy="27" r="22" fill="none" stroke="#E63030" stroke-width="4"/>
          <circle cx="27" cy="27" r="14" fill="none" stroke="#E63030" stroke-width="2" opacity="0.45"/>
          <circle cx="27" cy="27" r="7"  fill="none" stroke="#E63030" stroke-width="2" opacity="0.45"/>
          <line x1="27" y1="7"  x2="27" y2="47" stroke="#E63030" stroke-width="1.5" opacity="0.4"/>
          <line x1="7"  y1="27" x2="47" y2="27" stroke="#E63030" stroke-width="1.5" opacity="0.4"/>
          <circle cx="27" cy="27" r="2.5" fill="#E63030"/>
        </svg>
      </div>
      <h1>Olens</h1>
      <p data-i18n="odoo_analytics_platform">Odoo Analytics Platform</p>
    </div>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for cat, msg in messages %}
        <div class="alert alert-{{ cat }}" data-dismiss>
          <i class="fa-solid fa-circle-exclamation"></i>
          {{ msg }}
        </div>
      {% endfor %}
    {% endwith %}

    <form method="POST" action="{{ url_for('login') }}" autocomplete="off">
      <div style="display:flex;flex-direction:column;gap:1rem;">

        <div class="filter-group" style="width:100%">
          <label for="url" data-i18n="odoo_url">Odoo URL</label>
          <input
            type="text" id="url" name="url"
            class="form-control"
            placeholder="https://mycompany.odoo.com"
            value="{{ url|default('') }}"
            required autofocus
            style="width:100%"
          >
        </div>

        <div class="filter-group" style="width:100%">
          <label for="database" data-i18n="database">Database Name</label>
          <input
            type="text" id="database" name="database"
            class="form-control"
            placeholder="mycompany-production"
            value="{{ database|default('') }}"
            required
            style="width:100%"
          >
        </div>

        <div class="filter-group" style="width:100%">
          <label for="username" data-i18n="username">Username / Email</label>
          <input
            type="text" id="username" name="username"
            class="form-control"
            placeholder="admin@mycompany.com"
            value="{{ username|default('') }}"
            required
            style="width:100%"
          >
        </div>

        <div class="filter-group" style="width:100%">
          <label for="api_key" data-i18n="api_key">API Key / Password</label>
          <div style="position:relative">
            <input
              type="password" id="api_key" name="api_key"
              class="form-control"
              placeholder="Your Odoo API key"
              required
              style="width:100%;padding-right:2.5rem"
            >
            <button type="button" onclick="togglePwd()" tabindex="-1"
              style="position:absolute;right:.75rem;top:50%;transform:translateY(-50%);
                     background:none;border:none;color:#94a3b8;cursor:pointer;padding:0">
              <i class="fa-solid fa-eye" id="eyeIcon"></i>
            </button>
          </div>
          <small style="color:#94a3b8;font-size:.72rem;margin-top:.25rem" data-i18n="api_key_help">
            In Odoo: Settings → Technical → API Keys → Create
          </small>
        </div>

        <button type="submit" class="btn btn-primary" style="width:100%;justify-content:center;padding:.6rem 1rem;font-size:.9rem" data-i18n="connect_to_odoo">
          <i class="fa-solid fa-right-to-bracket"></i>
          Connect to Odoo
        </button>

      </div>
    </form>

    <div style="text-align:center;margin-top:1.5rem;padding-top:1.25rem;border-top:1px solid #e2e8f0">
      <p style="font-size:.75rem;color:#94a3b8;margin:0" data-i18n="secure_xmlrpc">
        Secure XML-RPC connection &bull; Credentials stored in session only
      </p>
    </div>

  </div>
</div>

<script>
function togglePwd() {
  const inp = document.getElementById('api_key');
  const icon = document.getElementById('eyeIcon');
  if (inp.type === 'password') {
    inp.type = 'text';
    icon.classList.replace('fa-eye', 'fa-eye-slash');
  } else {
    inp.type = 'password';
    icon.classList.replace('fa-eye-slash', 'fa-eye');
  }
}
</script>
<script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
